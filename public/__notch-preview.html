<!doctype html><meta charset="utf-8">
<style>
:root{ --page:#333; --bar:#fff; --linkWidth:90px; }
body{background:#222;color:#bbb;font:12px system-ui;margin:0;padding:24px}
.row{margin-bottom:26px}
.lab{margin-bottom:4px;font:11px ui-monospace}
.stage{transform:scale(4);transform-origin:0 0;height:420px;overflow:hidden;width:200px}
.stage>nav{margin-top:78px}
nav{width:230px;padding:8px;display:flex;align-items:center;background:var(--bar);border-radius:30px;margin-left:10px}
.sp{width:40px;height:40px}
ul{display:flex;list-style:none;margin:0;padding:0}
li{position:relative}
a{display:block;width:var(--linkWidth);text-align:center;color:#000;font:14px/24px system-ui;text-decoration:none}

/* ---- OLD ---- */
.old .indicator{display:block;position:absolute;top:-70px;left:calc(var(--linkWidth)/2);transform:translateX(-50%);width:70px;aspect-ratio:1/1;background-color:#333;border-radius:100%}
.old .indicator::before{content:"";aspect-ratio:1;background:#fff;border-top-right-radius:100%;width:6.5px;position:absolute;bottom:9.5px;left:4px;transform:rotate(357deg)}
.old .indicator::after{content:"";position:absolute;aspect-ratio:1;width:6.5px;right:4px;bottom:9.5px;background-color:#fff;border-top-left-radius:100%}

/* ---- NEW ---- */
.new .indicator{
  --notch:35; --depth:8; --feather:.6px; --overlap:1.5px;
  --k:calc(2*var(--notch) - var(--depth));
  --half:calc(sqrt(var(--depth)*var(--k))*1px);
  --dx:calc(sqrt((2*var(--fillet) + var(--depth))*var(--k))*1px);
  --fw:calc(var(--dx) - var(--half));
  --fh:calc(var(--fillet)*var(--k)/(var(--notch) + var(--fillet))*1px);
  --fc:calc(var(--fh) - var(--fillet)*1px);
  --fy:calc(var(--notch)*2px - var(--depth)*1px - var(--fh));
  display:block;position:absolute;top:calc(var(--notch)*-2px);
  left:calc(var(--linkWidth)/2);transform:translateX(-50%);
  width:calc(2*var(--dx));height:calc(var(--notch)*2px);pointer-events:none;
  background-repeat:no-repeat;
  background-image:
    radial-gradient(circle calc(var(--notch)*1px) at 50% 50%, var(--page) calc(100% - var(--feather)), #0000 100%),
    radial-gradient(circle calc(var(--fillet)*1px) at 0 var(--fc), #0000 calc(100% - var(--feather)), var(--bar) calc(100% + var(--feather))),
    radial-gradient(circle calc(var(--fillet)*1px) at 100% var(--fc), #0000 calc(100% - var(--feather)), var(--bar) calc(100% + var(--feather)));
  background-size: 100% 100%, var(--fw) calc(var(--fh) + var(--overlap)), var(--fw) calc(var(--fh) + var(--overlap));
  background-position: 0 0, 0 var(--fy), 100% var(--fy);
}
</style>
<div class="row"><div class="lab">obecne (::before/::after)</div><div class="stage"><nav class="old"><div class="sp"></div><ul><li><span class="indicator"></span><a>Książki</a></li><li><a>O nas</a></li></ul></nav></div></div>
<div class="row"><div class="lab">nowe — fillet 6</div><div class="stage"><nav class="new"><div class="sp"></div><ul><li><span class="indicator" style="--fillet:6"></span><a>Książki</a></li><li><a>O nas</a></li></ul></nav></div></div>
<div class="row"><div class="lab">nowe — fillet 10</div><div class="stage"><nav class="new"><div class="sp"></div><ul><li><span class="indicator" style="--fillet:10"></span><a>Książki</a></li><li><a>O nas</a></li></ul></nav></div></div>
<div class="row"><div class="lab">nowe — fillet 16</div><div class="stage"><nav class="new"><div class="sp"></div><ul><li><span class="indicator" style="--fillet:16"></span><a>Książki</a></li><li><a>O nas</a></li></ul></nav></div></div>
